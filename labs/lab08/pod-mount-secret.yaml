apiVersion: v1
kind: Pod
metadata:
  name: sekrety
spec:
  containers:
  - name: sekrety-cont
    image: httpd
    imagePullPolicy: IfNotPresent
    volumeMounts:
    - name: tajneprzezpoufne
      mountPath: /sekrety
      readOnly: true
  volumes:
  - name: tajneprzezpoufne
    secret:
      secretName: tajne-dane
