apiVersion: v1
kind: Pod
metadata:
  name: pod-affinity-required
  labels:
    app: v4
spec:
  containers:
  - name: www
    image: httpd
    imagePullPolicy: IfNotPresent
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: moc
            operator: In
            values:
            - full
