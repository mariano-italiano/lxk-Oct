apiVersion: v1
kind: Pod
metadata:
  name: pod-affinity-preferred-worker1
  labels:
    app: v4
spec:
  containers:
  - name: www
    image: httpd
    imagePullPolicy: IfNotPresent
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
            - worker1
