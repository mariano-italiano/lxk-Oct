---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mapa1
data:
  napis: Hurra Kubernetes
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-mapa1
spec:
  restartPolicy: Never
  containers:
  - name: pod-mapa1-kont1
    image: busybox
    imagePullPolicy: IfNotPresent
    command: ["/bin/sh", "-c", "echo $(POKAZ)"]
    env:
    - name: POKAZ
      valueFrom:
        configMapKeyRef:
          name: mapa1
          key: napis
