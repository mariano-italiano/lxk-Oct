apiVersion: v1
kind: Pod
metadata:
  name: kat-share
spec:
  containers:
  - name: first-cont
    image: alpine
    imagePullPolicy: IfNotPresent
    volumeMounts:
    - name: shared-data
      mountPath: /data
    command: ["sh", "-c", "echo hello > /data/plik1; sleep 3600"]
  - name: second-cont
    image: busybox
    imagePullPolicy: IfNotPresent
    volumeMounts:
    - name: shared-data
      mountPath: /data
    command: ["sh", "-c", "sleep 5; ls -l /data; cat /data/plik1; sleep 3600"]
  volumes:
  - name: shared-data
    emptyDir: {}
