apiVersion: v1
kind: Pod
metadata:
  name: volcont
spec:
  volumes:
  - name: vol1
    hostPath:
      path: /data
      type: DirectoryOrCreate
  containers:
  - name: volcont-pod
    image: busybox
    imagePullPolicy: IfNotPresent
    command: ['sh', '-c', 'sleep 3600']
    volumeMounts:
    - mountPath: /folderPod
      name: vol1
