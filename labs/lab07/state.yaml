apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app: redis
spec:
  serviceName: redis-service # obiekt Headless Service
  replicas: 5
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis-cont
        image: redis:5.0.1-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6379
          name: client
