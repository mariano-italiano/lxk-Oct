apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: www1
  name: www1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: www1
  strategy: {}
  template:
    metadata:
      labels:
        app: www1
    spec:
      containers:
      - image: nginx
        name: nginx
        imagePullPolicy: IfNotPresent
        resources: {}
