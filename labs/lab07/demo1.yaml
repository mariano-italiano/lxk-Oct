apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: demo1
  labels:
    app: nginx
spec:
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: demo1-pod-container
        image: nginx
        imagePullPolicy: IfNotPresent
