apiVersion: v1
kind: Pod
metadata:
  name: stress-pod2
spec:
  containers:
  - name: stress-cont1
    image: polinux/stress
    imagePullPolicy: IfNotPresent
    command: ["stress", "--cpu", "2"]
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
