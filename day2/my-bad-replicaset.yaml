apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: my-bad-replicaset
  labels:
    app: guestbook
    tier: frontend
spec:
  # modify replicas according to your case
  replicas: 3
  selector:
    matchLabels:
      tier: backend 
  template:
    metadata:
      labels:
        tier: backend
    spec:
      containers:
      - name: php-redis
        image: us-docker.pkg.dev/google-samples/containers/gke/gb-frontend:v5

