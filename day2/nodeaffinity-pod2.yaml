apiVersion: v1
kind: Pod
metadata:
  name: nodeaffinity-pod2
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/region
            operator: In
            values:
            - asia
            - europe
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
          - key: kubernetes.io/storage
            operator: In
            values:
            - platinum
  containers:
  - name: with-node-affinity
    image: registry.k8s.io/pause:3.8
