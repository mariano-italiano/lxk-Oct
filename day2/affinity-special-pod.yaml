apiVersion: v1
kind: Pod
metadata:
  name: affinity-special-pod
spec:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
          - key: kubernetes.io/region
            operator: In
            values:
            - europe
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
          - key: kubernetes.io/region
            operator: NotIn
            values:
            - asia
  containers:
  - name: with-node-affinity
    image: registry.k8s.io/pause:3.8
