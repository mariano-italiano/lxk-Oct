apiVersion: v1
kind: Pod
metadata:
  labels:
    run: ubuntu-pod
  name: configmap-vol-pod
spec:
  containers:
  - image: ubuntu
    name: ubuntu-pod
    command: ['sh', '-c', 'tail -F /tmp/test']
    volumeMounts:
      - name: cm-volume
        mountPath: /data
  volumes:
    - name: cm-volume
      configMap:
        name: my-configmap

