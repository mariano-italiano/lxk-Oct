apiVersion: v1
kind: Pod
metadata:
  name: nfs-pod
  labels:
    nfs: pod
spec:
  containers:
  - image: nginx
    name: test-container
    volumeMounts:
    - mountPath: /usr/share/nginx/html
      name: nfs-data
  volumes:
  - name: nfs-data 
    nfs:
      server: 192.168.1.125
      path: /var/nfs-share
