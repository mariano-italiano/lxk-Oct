apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  name: app-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: cars.lab.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cars-svc
            port:
              number: 80
  - host: garden.lab.local
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: garden-svc
            port:
              number: 80
