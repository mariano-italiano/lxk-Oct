apiVersion: v1
kind: Pod
metadata:
  name: nfs-dynamic-pod
  labels:
    pod: nfs-dynamic-pod
spec:
  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: nfs-dynamic-pvc
  containers:
    - name: task-pv-container
      image: nginx
      ports:
        - containerPort: 80
          name: "http-server"
      volumeMounts:
        - mountPath: "/usr/share/nginx/html"
          name: storage



