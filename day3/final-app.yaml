apiVersion: v1
kind: Namespace
metadata:
  name: voting
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-auth
  namespace: voting
data:
  password: K2FOS0dvL3ZCQjhhOTY3TEFWT3VKUER6
---
# Baza: Redis jako StatefulSet z volumeClaimTemplates (default StorageClass)
# Wymaga Secreta "redis-auth" z kluczem "password"
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: voting
  labels:
    app: redis
spec:
  clusterIP: None          # headless Service dla StatefulSet
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: voting
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - --requirepass
            - $(REDIS_PASSWORD)   # ekspansja zmiennej env przez kubelet
            - --appendonly
            - "yes"
            - --dir
            - /data
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # brak storageClassName => default StorageClass (w k3s: local-path)
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
---
# Konfiguracja aplikacji (nie-sekretna) + kod backendu
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: voting
data:
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  VOTE_OPTIONS: "Kubernetes,Docker Swarm"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-html
  namespace: voting
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="pl">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Voting App</title>
      <style>
        body { font-family: system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; }
        h1 { font-size: 1.6rem; }
        .option { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
        button { padding: 10px 18px; font-size: 1rem; cursor: pointer; border: 0; border-radius: 6px; background: #326ce5; color: #fff; min-width: 160px; }
        button:hover { background: #2554b8; }
        .count { font-size: 1.3rem; font-weight: bold; }
        .meta { margin-top: 24px; color: #666; font-size: 0.9rem; }
        .error { color: #c00; }
      </style>
    </head>
    <body>
      <h1>Na co głosujesz?</h1>
      <div id="options">Ładowanie...</div>
      <div class="meta">
        Wyniki z poda: <span id="results-pod">-</span><br>
        Ostatni głos obsłużył: <span id="vote-pod">-</span>
      </div>
      <script>
        const optionsEl = document.getElementById("options");

        async function loadResults() {
          try {
            const res = await fetch("/api/results");
            const data = await res.json();
            render(data);
            document.getElementById("results-pod").textContent = data.served_by;
          } catch (e) {
            optionsEl.innerHTML = '<p class="error">Brak połączenia z API</p>';
          }
        }

        function render(data) {
          optionsEl.innerHTML = "";
          data.options.forEach(opt => {
            const row = document.createElement("div");
            row.className = "option";
            const btn = document.createElement("button");
            btn.textContent = opt;
            btn.onclick = () => vote(opt);
            const count = document.createElement("span");
            count.className = "count";
            count.textContent = data.counts[opt];
            row.append(btn, count);
            optionsEl.append(row);
          });
        }

        async function vote(choice) {
          const res = await fetch("/api/vote", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ choice })
          });
          const data = await res.json();
          document.getElementById("vote-pod").textContent = data.served_by || "błąd";
          loadResults();
        }

        loadResults();
        setInterval(loadResults, 2000);
      </script>

    </body>
    </html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-code
  namespace: voting
data:
  app.py: |
    import os, socket
    from flask import Flask, jsonify, request
    import redis

    app = Flask(__name__)
    r = redis.Redis(
        host=os.environ.get("REDIS_HOST", "redis"),
        port=int(os.environ.get("REDIS_PORT", "6379")),
        password=os.environ.get("REDIS_PASSWORD"),
        decode_responses=True,
    )
    OPTIONS = [o.strip() for o in os.environ.get("VOTE_OPTIONS", "A,B").split(",")]
    POD = socket.gethostname()

    @app.get("/api/health")
    def health():
        return {"status": "ok", "served_by": POD}

    @app.get("/api/results")
    def results():
        counts = {o: int(r.get(f"votes:{o}") or 0) for o in OPTIONS}
        return jsonify({"options": OPTIONS, "counts": counts, "served_by": POD})

    @app.post("/api/vote")
    def vote():
        choice = (request.get_json(silent=True) or {}).get("choice")
        if choice not in OPTIONS:
            return jsonify({"error": "invalid choice"}), 400
        r.incr(f"votes:{choice}")
        return jsonify({"ok": True, "served_by": POD})

    app.run(host="0.0.0.0", port=5000)
---
# Backend: Flask API (2 repliki - demo load balancingu przez Service)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: voting
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: api
          image: python:3.12-slim
          command: ["sh", "-c"]
          args:
            - pip install --quiet --no-cache-dir flask redis && exec python /app/app.py
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
          ports:
            - containerPort: 5000
              name: http
          volumeMounts:
            - name: code
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
      volumes:
        - name: code
          configMap:
            name: backend-code
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: voting
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
# Frontend: nginx serwujący statyczny HTML z ConfigMapy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: voting
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
      volumes:
        - name: html
          configMap:
            name: frontend-html
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: voting
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      nodePort: 30080
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voting
  namespace: voting
spec:
  ingressClassName: nginx
  rules:
    - host: voting.lab.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
