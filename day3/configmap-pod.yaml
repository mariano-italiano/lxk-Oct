apiVersion: v1
kind: Pod
metadata:
  labels:
    run: ubuntu-pod
  name: configmap-pod
spec:
  containers:
  - image: ubuntu
    name: ubuntu-pod
    command: ['sh', '-c', 'tail -F /tmp/test']
    env: 
      - name: APP_X_BRANCH_NAME
        valueFrom:
          configMapKeyRef:
            name: my-configmap
            key: branch 
    envFrom: 
      - configMapRef:
          name: another-cm
